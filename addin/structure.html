<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文档结构</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="structure.css"><script src="structure.js" defer></script></head>
<body><main><header><div><h1>文档结构</h1><p>检查识别结果，按需指定段落角色。</p></div><button id="close" type="button">关闭</button></header>
<nav class="page-links" aria-label="排版工具"><a href="settings.html">排版设置</a><a href="structure.html" aria-current="page">文档结构</a><a href="environment.html">环境检查</a></nav>
<div id="feedback" role="status" aria-live="polite">正在连接 WPS…</div>
<section class="panel scope-panel" aria-labelledby="scopeTitle"><h2 id="scopeTitle">本次排版范围</h2><fieldset class="scope-options"><legend class="sr-only">排版范围</legend><label><input type="radio" name="scope" value="document" checked>整篇文档</label><label><input type="radio" name="scope" value="selection">选中段落</label></fieldset><p id="scopeHint" class="hint">选中部分文字时按所在整段处理。选区模式不修改页面、页眉页脚或页码；自然分页仍可能变化。</p></section>
<div id="invalidated" class="notice" role="alert" hidden><strong>文档已变化，请重新检查</strong><p id="invalidatedMessage">原有人工标记已失效。重新分析后再排版。</p></div>
<div class="structure-actions"><button id="analyze" type="button" class="primary">重新分析</button><button id="preview" type="button">查看改动清单</button><span id="analysisSummary" role="status" aria-live="polite"></span></div>
<p class="session-note">人工标记只用于当前文档会话，关闭或切换文档、增删文字或拆合段落后失效。“保持原样”完全排除本次写入。</p>
<section class="panel structure-panel" aria-labelledby="paragraphsTitle"><div class="list-head"><h2 id="paragraphsTitle">段落识别</h2><label for="rowFilter">显示<select id="rowFilter"><option value="eligible">普通段落</option><option value="all">全部段落</option></select></label></div><div id="empty" class="empty-state" hidden><p>尚未读取到可排版的普通段落。</p><button id="retry" type="button">重新分析</button></div><div id="paragraphTable" class="table-scroll" hidden><table><thead><tr><th scope="col">段落</th><th scope="col">摘要</th><th scope="col">角色</th><th scope="col">识别依据</th></tr></thead><tbody id="paragraphRows"></tbody></table></div><div id="pagination" class="list-pagination" hidden><button id="previous" type="button">上一页</button><span id="pageSummary"></span><button id="next" type="button">下一页</button></div></section>
<section id="previewPanel" class="panel preview-panel" aria-labelledby="previewTitle" hidden><div class="list-head"><h2 id="previewTitle">预计改动</h2><button id="closePreview" type="button">收起清单</button></div><p id="previewSummary"></p><p id="previewWarnings" class="hint"></p><ul id="previewRows" class="change-list"></ul><p class="hint">清单只读取和预估。返回 WPS 点击“一键排版”执行；实际结果以排版回读为准。</p></section>
</main></body></html>
