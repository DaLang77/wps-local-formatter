name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
      - run: bash scripts/package.sh
      - run: python3 tests/verify-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: node-zip
          path: release/wps-local-formatter-1.2.0-beta.1-*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
      - run: python3 tests/verify-settings-store.py
      - run: python3 tests/verify-installer.py
      - run: bash scripts/build.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/ui-browser.test.cjs
