name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/verify-settings-store.py
      - run: python3 tests/verify-installer.py
      - run: bash scripts/build.sh
      - run: codesign --verify --deep --strict dist/WPS一键排版.app
